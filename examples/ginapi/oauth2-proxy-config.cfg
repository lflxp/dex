# 基础配置
http_address = "0.0.0.0:4180"
reverse_proxy = true
skip_provider_button = true  # 跳过选择提供者（直接用Dex）

# OIDC 提供者配置（对接Dex）
provider = "oidc"
oidc_issuer_url = "http://127.0.0.1:5556/dex"  # 匹配Dex的issuer地址
client_id = "my-app"        # 匹配Dex的staticClients.id
client_secret = "my-app-secret-123"    # 匹配Dex的staticClients.secret
scope = "openid email profile"           # 请求的OIDC作用域
# 认证后转发的后端应用地址
upstreams = ["http://127.0.0.1:8080"]  # 指向测试用的Nginx服务

# 会话cookie配置（测试用，生产需加密）
cookie_expire = "24h0ms"
cookie_httponly = true
cookie_secure = false  # 本地测试关闭HTTPS要求
cookie_samesite = "lax"
cookie_name = "_oauth2_proxy"

# 允许的用户（匹配Dex的静态用户邮箱）
email_domains = ["*"]  # 测试用允许所有域名，生产需限制

# 开启 Access Token 传递（必须）
pass_access_token = true

# 自动生成 Authorization: Bearer <token> 请求头（必须）
set_authorization_header = true

# 关键：禁用强制授权提示（移除 approval_prompt=force）
approval_prompt = "auto"        # 核心：覆盖默认的 force，改为 auto（仅首次需要授权时提示，配置skip后不提示）
prompt = "none"                 # 补充：OIDC 标准 prompt 参数，无交互
# oidc_skip_approval_prompt = true # 兜底：强制跳过 oauth2-proxy 层面的授权提示